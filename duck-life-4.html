<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duck Life 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    ruffle-player, iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      outline: none;
    }
    .top-controls {
      position: fixed;
      top: 10px;
      right: 14px;
      z-index: 9999;
      display: flex;
      gap: 8px;
      opacity: 0.25;
      transition: opacity 0.2s ease;
    }
    .top-controls:hover {
      opacity: 1;
    }
    .control-btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .control-btn:hover {
      background: rgba(59, 130, 246, 0.8);
      border-color: rgba(96, 165, 250, 0.5);
    }
    #loading-msg {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: #94a3b8;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div class="top-controls">
    <button class="control-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button class="control-btn" onclick="location.reload()">↻ Reload</button>
  </div>

  <div id="game-container">
    <div id="loading-msg">
      <div class="spinner"></div>
      <div>Loading Duck Life 4...</div>
    </div>
  </div>

  <script>
    const swfSources = [
      "https://raw.githubusercontent.com/BinBashBanana/gstore/master/ducklife4.swf",
      "https://cdn.jsdelivr.net/gh/BinBashBanana/gstore@master/ducklife4.swf"
    ];

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      forceScale: true,
      openUrlMode: "confirm"
    };

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("game-container");
      const loadingMsg = document.getElementById("loading-msg");

      try {
        const ruffle = window.RufflePlayer.newest?.() || window.RufflePlayer.createPlayer?.();
        if (!ruffle) {
          throw new Error("Ruffle player not found, falling back to WebGL.");
        }

        const player = ruffle.createPlayer();
        container.appendChild(player);

        let loaded = false;
        for (const swfUrl of swfSources) {
          try {
            await player.load(swfUrl);
            loaded = true;
            if (loadingMsg) loadingMsg.style.display = "none";
            break;
          } catch (err) {
            console.warn("Failed to load SWF: " + swfUrl, err);
          }
        }

        if (!loaded) {
          // Fallback to WebGL version
          loadWebGLFallback(container, loadingMsg);
        }
      } catch (e) {
        loadWebGLFallback(container, loadingMsg);
      }
    });

    function loadWebGLFallback(container, loadingMsg) {
      container.innerHTML = "";
      const iframe = document.createElement("iframe");
      iframe.src = "https://cdn.jsdelivr.net/gh/ShadowDevLabs/files@main/ducklife4/index.html";
      iframe.allow = "autoplay; fullscreen; gamepad";
      iframe.onload = () => {
        if (loadingMsg) loadingMsg.style.display = "none";
      };
      container.appendChild(iframe);
    }
  </script>
</body>
</html>
