<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="HandheldFriendly" content="true">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pizza Tower</title>
  <link href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@e412e02bf3f9785174978b3b420f0bc21d166b5f/annie.css" rel="stylesheet" type="text/css">
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #c2canvasdiv {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #c2canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body dir="ltr">
  <div id="fb-root"></div>
  <div id="c2canvasdiv">
    <canvas id="c2canvas" width="1262" height="928">
      <h1>Your browser does not support HTML5 canvas.</h1>
    </canvas>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@2d942b638a721bcd9878dde84c6530acaa422385/jp.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@2d942b638a721bcd9878dde84c6530acaa422385/c2p.js"></script>
  <script>
    jQuery(document).ready(function () {
      cr_createRuntime("c2canvas");
    });
    function onVisibilityChanged() {
      if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
        cr_setSuspended(true);
      else
        cr_setSuspended(false);
    };
    document.addEventListener("visibilitychange", onVisibilityChanged, false);
    document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
    document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
    document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
  </script>
</body>
</html>
